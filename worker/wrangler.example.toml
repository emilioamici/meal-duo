# Copia questo file in worker/wrangler.toml (ignorato da Git) e inserisci l'ID del tuo spazio KV.
name = "mealduo-push"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[vars]
# Origine del sito (solo schema + dominio, senza /meal-duo). Più origini separate da virgola.
ALLOWED_ORIGINS = "https://<utente>.github.io,http://localhost:5173"
# Contatto inviato ai servizi di push: l'indirizzo del sito va benissimo
VAPID_SUBJECT = "https://<utente>.github.io/meal-duo/"

# Solo per l'accesso persistente (facoltativo): ID del client OAuth di Google Cloud (è un identificativo pubblico).
# Il client secret e SESSION_KEY NON vanno qui: si impostano con `npx wrangler secret put` (vedi README).
# GOOGLE_CLIENT_ID = "xxxx.apps.googleusercontent.com"

# Promemoria dei pasti a orario: il Worker si sveglia ogni 5 minuti e invia le notifiche arrivate all'orario.
# SENZA queste due righe gli orari non partono mai (l'app avvisa se il server non li sta eseguendo).
[triggers]
crons = ["*/5 * * * *"]

[[kv_namespaces]]
binding = "SUBS"
id = "INSERISCI_QUI_L_ID_DEL_KV"
